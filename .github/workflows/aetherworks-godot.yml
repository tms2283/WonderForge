name: Aetherworks Native Godot Validation

on:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/aetherworks-godot.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/aetherworks-godot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 stable x86_64 editor
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import GDScript classes and game assets
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/game --editor --import --quit
      - name: Instantiate native world, building editor and quest campaign
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/game --script res://tests/Smoke.gd
      - name: Inspect source data and scene references
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('godot/game')
          for p in root.rglob('*.json'):
              json.loads(p.read_text('utf-8'))
          for p in root.rglob('*.tscn'):
              t=p.read_text('utf-8')
              assert '[gd_scene' in t and '[node' in t, p
          print('Godot JSON and scene files structurally valid')
          PY
